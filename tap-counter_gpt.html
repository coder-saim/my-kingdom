<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f5f6fa" />
  <meta name="description" content="A beautifully simple tap counter with themes, session stats, and saved progress." />
  <title>Taply — Tap Counter</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f6fa;
      --surface: rgba(255,255,255,.82);
      --surface-solid: #ffffff;
      --surface-soft: #f0f2f8;
      --text: #171a2b;
      --muted: #777d91;
      --line: rgba(31, 37, 65, .09);
      --accent: #6558f5;
      --accent-strong: #5143e9;
      --accent-soft: rgba(101,88,245,.11);
      --action-start: #5f51ed;
      --action-end: #5143dc;
      --mint: #30b89a;
      --shadow: 0 22px 65px rgba(39, 43, 83, .09);
      --shadow-small: 0 8px 24px rgba(39, 43, 83, .08);
      --ring: rgba(101,88,245,.25);
    }
    [data-theme="dark"] {
      color-scheme: dark;
      --bg: #0d1019;
      --surface: rgba(25,28,43,.96);
      --surface-solid: #191c2b;
      --surface-soft: #24283b;
      --text: #f8f9ff;
      --muted: #b7bdd4;
      --line: rgba(222,225,255,.16);
      --accent: #b2aaff;
      --accent-strong: #cbc5ff;
      --accent-soft: rgba(164,151,255,.18);
      --action-start: #5f51ed;
      --action-end: #4937c9;
      --mint: #69e4c4;
      --shadow: 0 22px 65px rgba(0,0,0,.38);
      --shadow-small: 0 8px 24px rgba(0,0,0,.3);
      --ring: rgba(178,170,255,.45);
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(ellipse at 16% 4%, rgba(128,115,255,.10), transparent 35%),
        radial-gradient(ellipse at 91% 90%, rgba(53,200,170,.08), transparent 30%),
        var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      transition: background-color .25s ease, color .25s ease;
    }
    button { font: inherit; }
    button:focus-visible { outline: 3px solid var(--ring); outline-offset: 4px; }
    .app-shell { width: min(1120px, calc(100% - 40px)); margin: 0 auto; padding: 28px 0 30px; }
    .topbar { display:flex; align-items:center; justify-content:space-between; gap:18px; margin-bottom:36px; }
    .brand { display:flex; align-items:center; gap:12px; min-width:0; }
    .brand-mark { width:42px; height:42px; display:grid; place-items:center; border-radius:14px; color:white; background:linear-gradient(145deg,#887cff,#5c4ce9); box-shadow:0 8px 20px rgba(101,88,245,.28); flex-shrink:0; }
    .brand-mark svg { width:22px; height:22px; }
    .brand-name { font-size:19px; font-weight:800; letter-spacing:-.7px; }
    .brand-tagline { color:var(--muted); font-size:12px; margin-top:2px; }
    .top-actions { display:flex; align-items:center; gap:10px; }
    .icon-button { width:43px; height:43px; border-radius:14px; display:grid; place-items:center; border:1px solid var(--line); background:var(--surface); color:var(--text); cursor:pointer; transition:transform .18s ease, background .2s ease, border-color .2s ease; }
    .icon-button:hover { transform:translateY(-2px); background:var(--surface-solid); }
    .icon-button svg { width:19px; height:19px; }
    .theme-label { color:var(--muted); font-size:13px; font-weight:600; }
    .eyebrow { color:var(--accent); font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:1.8px; }
    .page-heading { margin:0; font-size:clamp(28px,4vw,39px); letter-spacing:-1.6px; line-height:1.13; font-weight:800; }
    .page-subheading { margin:10px 0 0; color:var(--muted); font-size:14px; line-height:1.65; }
    .heading-row { display:flex; align-items:flex-end; justify-content:space-between; gap:20px; margin-bottom:25px; }
    .session-pill { display:inline-flex; align-items:center; gap:8px; padding:9px 12px; border:1px solid var(--line); background:var(--surface); border-radius:999px; color:var(--muted); font-size:12px; font-weight:650; white-space:nowrap; }
    .live-dot { width:7px; height:7px; background:var(--mint); border-radius:50%; box-shadow:0 0 0 4px color-mix(in srgb, var(--mint) 13%, transparent); }
    .dashboard { display:grid; grid-template-columns:minmax(0,1.5fr) minmax(290px,.85fr); gap:22px; align-items:stretch; }
    .panel { border:1px solid var(--line); border-radius:27px; background:var(--surface); box-shadow:var(--shadow); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px); }
    .counter-panel { padding:clamp(22px,4vw,38px); display:flex; flex-direction:column; align-items:center; text-align:center; min-width:0; overflow:hidden; position:relative; }
    .counter-panel::before { content:""; position:absolute; width:280px; height:280px; border-radius:50%; background:var(--accent-soft); filter:blur(55px); top:70px; left:50%; transform:translateX(-50%); pointer-events:none; }
    .counter-top { position:relative; z-index:1; display:flex; align-items:center; justify-content:space-between; width:100%; gap:10px; }
    .counter-caption { color:var(--muted); font-size:13px; font-weight:650; }
    .session-menu { border:0; background:transparent; color:var(--muted); display:grid; place-items:center; width:34px; height:34px; border-radius:10px; cursor:pointer; }
    .session-menu:hover { background:var(--surface-soft); color:var(--text); }
    .session-menu svg { width:19px; height:19px; }
    .count-wrap { position:relative; z-index:1; margin:29px 0 26px; }
    .count-number { display:block; font-variant-numeric:tabular-nums; font-size:clamp(76px,12vw,124px); line-height:1; letter-spacing:-7px; font-weight:800; color:var(--text); transition:transform .16s ease; overflow-wrap:anywhere; }
    .count-number.bump { animation:bump .2s ease-out; }
    @keyframes bump { 0%{transform:scale(1)} 45%{transform:scale(1.065)} 100%{transform:scale(1)} }
    .count-unit { display:block; margin-top:12px; color:var(--muted); font-size:13px; font-weight:600; letter-spacing:.2px; }
    .tap-button { position:relative; z-index:1; width:min(100%,280px); min-height:66px; display:flex; justify-content:center; align-items:center; gap:11px; border:0; border-radius:19px; background:linear-gradient(120deg,var(--action-start),var(--action-end)); color:#fff; font-size:16px; font-weight:800; letter-spacing:.1px; cursor:pointer; box-shadow:0 11px 24px rgba(101,88,245,.27), inset 0 1px 0 rgba(255,255,255,.25); transition:transform .16s ease, box-shadow .16s ease, filter .16s ease; -webkit-tap-highlight-color:transparent; user-select:none; }
    .tap-button:hover { transform:translateY(-2px); box-shadow:0 15px 28px rgba(101,88,245,.34), inset 0 1px 0 rgba(255,255,255,.25); }
    .tap-button:active { transform:translateY(1px) scale(.985); box-shadow:0 5px 12px rgba(101,88,245,.25); }
    .tap-button svg { width:21px; height:21px; }
    .button-hint { color:var(--muted); font-size:11px; margin-top:12px; position:relative; z-index:1; }
    kbd { display:inline-grid; place-items:center; min-width:22px; height:21px; padding:0 6px; border:1px solid var(--line); border-bottom-width:2px; border-radius:6px; color:var(--muted); font:600 10px ui-monospace,SFMono-Regular,Menlo,monospace; background:var(--surface-solid); margin:0 2px; }
    .control-row { position:relative; z-index:1; width:min(100%,360px); display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-top:27px; }
    .control-button { min-height:48px; padding:0 10px; display:flex; justify-content:center; align-items:center; gap:7px; color:var(--text); border:1px solid var(--line); border-radius:13px; background:var(--surface-solid); font-weight:700; font-size:12px; cursor:pointer; transition:background .18s ease, transform .18s ease, border-color .18s ease; }
    .control-button:hover { background:var(--surface-soft); transform:translateY(-1px); }
    .control-button:active { transform:translateY(0); }
    .control-button svg { width:16px; height:16px; color:var(--muted); }
    .control-button.danger:hover { color:#e45c73; border-color:rgba(228,92,115,.28); }
    .control-button.danger:hover svg { color:#e45c73; }
    .side-column { display:flex; flex-direction:column; gap:18px; min-width:0; }
    .stats-panel { padding:25px; }
    .section-heading { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:21px; }
    .section-heading h2 { margin:0; font-size:15px; letter-spacing:-.3px; }
    .section-icon { width:34px; height:34px; display:grid; place-items:center; border-radius:11px; background:var(--accent-soft); color:var(--accent); }
    .section-icon svg { width:17px; height:17px; }
    .stats-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .stat-card { min-width:0; border-radius:17px; padding:16px 14px; background:var(--surface-soft); border:1px solid var(--line); }
    .stat-label { display:flex; align-items:center; gap:7px; color:var(--muted); font-size:12px; font-weight:650; line-height:1.4; }
    .stat-label svg { width:14px; height:14px; flex-shrink:0; }
    .stat-value { margin-top:13px; font-size:25px; letter-spacing:-1px; font-variant-numeric:tabular-nums; font-weight:800; overflow-wrap:anywhere; }
    .stat-note { margin-top:4px; font-size:11px; color:var(--muted); }
    .goal-panel { padding:24px 25px; }
    .goal-title-wrap { display:flex; align-items:center; gap:10px; }
    .goal-title-wrap h2 { margin:0; font-size:15px; }
    .goal-copy { color:var(--muted); font-size:12px; line-height:1.5; margin:3px 0 17px; }
    .goal-topline { display:flex; justify-content:space-between; align-items:center; gap:12px; font-size:12px; font-weight:750; margin-bottom:10px; }
    .goal-percent { color:var(--accent); font-variant-numeric:tabular-nums; }
    .progress-track { height:9px; background:var(--surface-soft); border:1px solid var(--line); border-radius:999px; overflow:hidden; }
    .progress-fill { width:0%; height:100%; border-radius:999px; background:linear-gradient(90deg,var(--accent),#56cbb4); transition:width .35s cubic-bezier(.2,.8,.2,1); }
    .goal-bottomline { display:flex; justify-content:space-between; margin-top:10px; color:var(--muted); font-size:11px; }
    .goal-edit { border:0; padding:5px 7px; border-radius:7px; color:var(--accent); background:var(--accent-soft); font-size:10px; font-weight:750; cursor:pointer; }
    .goal-edit:hover { filter:brightness(1.06); }
    .footer { display:flex; justify-content:space-between; align-items:center; gap:14px; color:var(--muted); font-size:11px; padding:25px 4px 0; }
    .footer-brand { display:flex; align-items:center; gap:6px; }
    .footer-brand svg { width:13px; height:13px; color:var(--accent); }
    .keyboard-note { display:flex; align-items:center; gap:5px; }
    .toast { position:fixed; left:50%; bottom:26px; z-index:10; transform:translate(-50%,18px); opacity:0; pointer-events:none; padding:12px 16px; border:1px solid var(--line); border-radius:13px; background:var(--surface-solid); color:var(--text); box-shadow:var(--shadow-small); font-size:13px; font-weight:650; transition:opacity .2s ease, transform .2s ease; max-width:calc(100% - 32px); text-align:center; }
    .toast.show { opacity:1; transform:translate(-50%,0); }
    .modal-backdrop { position:fixed; inset:0; z-index:20; display:none; place-items:center; padding:20px; background:rgba(12,13,24,.45); backdrop-filter:blur(5px); }
    .modal-backdrop.open { display:grid; }
    .modal { width:min(100%,390px); padding:26px; border-radius:24px; border:1px solid var(--line); background:var(--surface-solid); color:var(--text); box-shadow:0 25px 80px rgba(0,0,0,.22); animation:modalIn .18s ease-out; }
    @keyframes modalIn { from{opacity:0;transform:translateY(8px) scale(.98)} to{opacity:1;transform:translateY(0) scale(1)} }
    .modal h2 { font-size:20px; letter-spacing:-.6px; margin:0 0 8px; }
    .modal p { color:var(--muted); font-size:13px; line-height:1.6; margin:0 0 20px; }
    .field-label { display:block; font-size:12px; font-weight:750; margin-bottom:8px; }
    .number-input { width:100%; padding:13px 14px; border-radius:12px; outline:none; color:var(--text); border:1px solid var(--line); background:var(--surface-soft); font:700 16px inherit; font-size:16px; }
    .number-input:focus { border-color:var(--accent); box-shadow:0 0 0 3px var(--ring); }
    .modal-actions { display:flex; justify-content:flex-end; gap:9px; margin-top:21px; }
    .modal-btn { border:1px solid var(--line); border-radius:11px; background:var(--surface-soft); color:var(--text); padding:11px 15px; font-size:12px; font-weight:750; cursor:pointer; }
    .modal-btn.primary { border-color:transparent; background:var(--action-start); color:#fff; }
    .modal-btn:hover { filter:brightness(1.06); }
    .app-shell { padding-top:24px; }
    .topbar { padding:10px 14px 10px 10px; margin-bottom:30px; border:1px solid var(--line); border-radius:18px; background:color-mix(in srgb, var(--surface) 82%, transparent); box-shadow:var(--shadow-small); }
    .brand-mark { width:40px; height:40px; border-radius:12px; }
    .heading-row { padding:0 4px; }
    .page-heading { font-size:clamp(30px,4vw,44px); }
    .panel { box-shadow:var(--shadow-small); }
    .counter-panel { border-color:color-mix(in srgb, var(--accent) 22%, var(--line)); }
    .count-wrap { margin-top:36px; }
    .count-number { text-shadow:0 8px 28px color-mix(in srgb, var(--accent) 14%, transparent); }
    .tap-button { width:min(100%,310px); min-height:72px; border-radius:22px; font-size:17px; }
    .control-button { min-height:44px; }
    .stats-panel,.goal-panel { border-radius:22px; }
    .stat-card { transition:transform .18s ease, border-color .18s ease, background .18s ease; }
    .stat-card:hover { transform:translateY(-2px); border-color:color-mix(in srgb, var(--accent) 28%, var(--line)); background:color-mix(in srgb, var(--surface-soft) 82%, var(--accent-soft)); }
    .progress-track { height:10px; }
    @media (max-width:760px) {
      .app-shell { width:min(100% - 28px,540px); padding-top:19px; }
      .topbar { margin-bottom:25px; }
      .theme-label { display:none; }
      .heading-row { align-items:flex-start; flex-direction:column; gap:14px; margin-bottom:20px; }
      .dashboard { grid-template-columns:1fr; gap:16px; }
      .counter-panel { padding:25px 19px 24px; border-radius:24px; }
      .count-wrap { margin:33px 0 26px; }
      .count-number { font-size:clamp(78px,23vw,112px); letter-spacing:-5px; }
      .tap-button { min-height:64px; }
      .side-column { display:grid; grid-template-columns:1fr; gap:16px; }
      .stats-panel,.goal-panel { padding:21px; }
      .footer { padding-top:20px; flex-wrap:wrap; }
    }
    @media (max-width:520px) {
      .app-shell { width: min(100% - 20px, 540px); padding-bottom: 22px; }
      .topbar { padding-inline: 9px; }
      .heading-row { padding-inline: 0; }
      .counter-panel { padding-inline: 16px; }
      .control-row { width: 100%; }
      .tap-button { width: min(100%, 280px); }
      .footer { gap: 10px; }
      .keyboard-note { width: 100%; justify-content: center; }
    }
    @media (max-width:380px) {
      .app-shell { width:calc(100% - 22px); }
      .brand-tagline { display:none; }
      .counter-panel { padding-inline:15px; }
      .control-row { gap:7px; }
      .control-button { gap:5px; font-size:11px; padding-inline:5px; }
      .stats-panel,.goal-panel { padding:18px; }
      .stat-card { padding:13px 11px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *,*::before,*::after { animation-duration:.01ms!important; animation-iteration-count:1!important; scroll-behavior:auto!important; transition-duration:.01ms!important; }
    }
  </style>
</head>
<body>
  <div class="app-shell" id="app" data-theme="light">
    <header class="topbar">
      <div class="brand" aria-label="Taply home">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 11V5.5a2 2 0 0 1 4 0V11"/><path d="M12 10V4.8a2 2 0 0 1 4 0V12"/><path d="M16 11V7.5a2 2 0 0 1 4 0v7.2c0 4-2.8 6.3-6.6 6.3h-1.1c-2.2 0-3.5-.9-4.8-2.4l-3-3.5a2 2 0 0 1 3-2.7L10 15"/></svg>
        </div>
        <div><div class="brand-name">Taply<span style="color:var(--accent)">.</span></div><div class="brand-tagline">Tap counter</div></div>
      </div>
      <div class="top-actions">
        <span class="theme-label" id="themeLabel">Light appearance</span>
        <button class="icon-button" id="themeToggle" aria-label="Switch to dark mode" title="Switch theme">
          <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.2 15.1A8.5 8.5 0 0 1 8.9 3.8 8.5 8.5 0 1 0 20.2 15.1Z"/></svg>
        </button>
      </div>
    </header>

    <main>
      <div class="heading-row">
        <div>
          <div class="eyebrow" style="margin-bottom:10px">Tap counter</div>
          <h1 class="page-heading">Count taps.</h1>
          <p class="page-subheading">Tap to begin.</p>
        </div>
        <div class="session-pill"><span class="live-dot"></span><span id="sessionLabel">Active</span></div>
      </div>

      <div class="dashboard">
        <section class="panel counter-panel" aria-label="Tap counter">
          <div class="counter-top">
            <span class="counter-caption">COUNT</span>
            <button class="session-menu" id="clearButton" aria-label="Clear counter" title="Clear counter">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6m4-6v6M5 7l1 13h12l1-13M9 7V4h6v3"/></svg>
            </button>
          </div>
          <div class="count-wrap" aria-live="polite" aria-atomic="true">
            <span class="count-number" id="countDisplay">0</span>
            <span class="count-unit">taps</span>
          </div>
          <button class="tap-button" id="tapButton" aria-label="Add one tap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            <span>Tap</span>
          </button>
          <div class="button-hint"><kbd>Space</kbd> to tap</div>
          <div class="control-row" aria-label="Counter controls">
            <button class="control-button" id="undoButton" title="Remove one tap">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h9a7 7 0 0 1 0 14h-2"/></svg><span>Undo</span>
            </button>
            <button class="control-button" id="minusButton" title="Subtract one">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"/></svg><span>-1</span>
            </button>
            <button class="control-button danger" id="resetButton" title="Reset this session">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg><span>Reset</span>
            </button>
          </div>
        </section>

        <aside class="side-column" aria-label="Session insights">
          <section class="panel stats-panel">
            <div class="section-heading">
              <h2>Stats</h2>
              <span class="section-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-4 4"/></svg></span>
            </div>
            <div class="stats-grid">
              <div class="stat-card">
                <div class="stat-label"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Time</div>
                <div class="stat-value" id="elapsedValue">00:00</div>
                <div class="stat-note">Elapsed</div>
              </div>
              <div class="stat-card">
                <div class="stat-label"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M17 8a5 5 0 0 0-10 0c0 5 10 3 10 8a5 5 0 0 1-10 0"/></svg>Rate</div>
                <div class="stat-value" id="rateValue">0.0</div>
                <div class="stat-note">Per minute</div>
              </div>
              <div class="stat-card">
                <div class="stat-label"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 2.7 5.5 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9-5.4 2.9 1-6.1-4.4-4.3 6.1-.9L12 3Z"/></svg>Best</div>
                <div class="stat-value" id="bestValue">0</div>
                <div class="stat-note">Record</div>
              </div>
              <div class="stat-card">
                <div class="stat-label"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 5h8M8 9h8M8 13h5"/><path d="M5 3h14v18l-7-4-7 4V3Z"/></svg>Total</div>
                <div class="stat-value" id="allTimeValue">0</div>
                <div class="stat-note">All time</div>
              </div>
            </div>
          </section>

          <section class="panel goal-panel">
            <div class="section-heading" style="margin-bottom:14px">
              <div class="goal-title-wrap">
                <span class="section-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg></span>
                <h2>Goal</h2>
              </div>
              <button class="goal-edit" id="editGoalButton">EDIT</button>
            </div>
            <p class="goal-copy">Set a target.</p>
            <div class="goal-topline"><span id="goalProgressText">0 / 100</span><span class="goal-percent" id="goalPercent">0%</span></div>
            <div class="progress-track" role="progressbar" id="goalProgressBar" aria-label="Goal progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="progress-fill" id="goalProgressFill"></div></div>
            <div class="goal-bottomline"><span>Go</span><span id="remainingText">100 left</span></div>
          </section>
        </aside>
      </div>
    </main>
    <footer class="footer">
      <div class="footer-brand"><span>Taply</span></div>
      <div class="keyboard-note"><kbd>Space</kbd> tap <span style="padding:0 3px">·</span> <kbd>U</kbd> undo</div>
    </footer>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <div class="modal-backdrop" id="goalModalBackdrop" role="presentation">
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="goalModalTitle" aria-describedby="goalModalDescription">
      <h2 id="goalModalTitle">Set goal</h2>
      <p id="goalModalDescription">Choose a target.</p>
      <form id="goalForm">
        <label class="field-label" for="goalInput">Taps</label>
        <input class="number-input" id="goalInput" type="number" min="1" max="1000000000" step="1" value="100" required inputmode="numeric" />
        <div class="modal-actions"><button type="button" class="modal-btn" id="cancelGoalButton">Cancel</button><button type="submit" class="modal-btn primary">Save</button></div>
      </form>
    </section>
  </div>

  <script>
    (() => {
      'use strict';
      const $ = (selector) => document.querySelector(selector);
      const app = $('#app');
      const countDisplay = $('#countDisplay');
      const tapButton = $('#tapButton');
      const toast = $('#toast');
      const themeToggle = $('#themeToggle');
      const themeIcon = $('#themeIcon');
      const themeLabel = $('#themeLabel');
      const goalModalBackdrop = $('#goalModalBackdrop');
      const goalInput = $('#goalInput');
      const STORAGE_KEY = 'taply-counter-v1';
      const MOON_ICON = '<path d="M20.2 15.1A8.5 8.5 0 0 1 8.9 3.8 8.5 8.5 0 1 0 20.2 15.1Z"/>';
      const SUN_ICON = '<circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/>';
      let toastTimeout;
      let count = 0;
      let goal = 100;
      let allTime = 0;
      let best = 0;
      let sessionStartedAt = Date.now();
      let currentTheme = 'light';
      let history = [];

      function readSavedState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return;
          const saved = JSON.parse(raw);
          if (saved && typeof saved === 'object') {
            count = validNumber(saved.count, 0, 0, 1_000_000_000);
            goal = validNumber(saved.goal, 100, 1, 1_000_000_000);
            allTime = validNumber(saved.allTime, 0, 0, Number.MAX_SAFE_INTEGER);
            best = validNumber(saved.best, count, 0, 1_000_000_000);
            currentTheme = saved.theme === 'dark' ? 'dark' : 'light';
            sessionStartedAt = Number.isFinite(saved.sessionStartedAt) && saved.sessionStartedAt > 0 ? saved.sessionStartedAt : Date.now();
            history = Array.isArray(saved.history) ? saved.history.slice(-100).filter(n => Number.isInteger(n) && n >= 0 && n <= 1_000_000_000) : [];
          }
        } catch (_) { /* Storage may be unavailable or contain invalid data; use defaults. */ }
      }
      function validNumber(value, fallback, min, max) {
        const parsed = Number(value);
        return Number.isFinite(parsed) ? Math.min(max, Math.max(min, Math.floor(parsed))) : fallback;
      }
      function saveState() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify({ count, goal, allTime, best, theme: currentTheme, sessionStartedAt, history }));
        } catch (_) { /* App still works when browser storage is disabled or full. */ }
      }
      function formatNumber(value) { return new Intl.NumberFormat(undefined, { maximumFractionDigits: 0 }).format(value); }
      function formatDuration(milliseconds) {
        const seconds = Math.max(0, Math.floor(milliseconds / 1000));
        const hours = Math.floor(seconds / 3600);
        const minutes = Math.floor((seconds % 3600) / 60);
        const remainder = seconds % 60;
        if (hours > 0) return `${String(hours).padStart(2,'0')}:${String(minutes).padStart(2,'0')}:${String(remainder).padStart(2,'0')}`;
        return `${String(minutes).padStart(2,'0')}:${String(remainder).padStart(2,'0')}`;
      }
      function applyTheme(theme) {
        currentTheme = theme === 'dark' ? 'dark' : 'light';
        app.dataset.theme = currentTheme;
        // Apply the theme at the document level too, so the page background,
        // inherited text, browser controls, and app panels all use one palette.
        document.documentElement.dataset.theme = currentTheme;
        document.documentElement.style.colorScheme = currentTheme;
        themeIcon.innerHTML = currentTheme === 'light' ? MOON_ICON : SUN_ICON;
        themeToggle.setAttribute('aria-label', currentTheme === 'light' ? 'Switch to dark mode' : 'Switch to light mode');
        themeLabel.textContent = currentTheme === 'light' ? 'Light appearance' : 'Dark appearance';
        const metaTheme = document.querySelector('meta[name="theme-color"]');
        if (metaTheme) metaTheme.content = currentTheme === 'light' ? '#f5f6fa' : '#10111a';
        saveState();
      }
      function render() {
        countDisplay.textContent = formatNumber(count);
        $('#bestValue').textContent = formatNumber(best);
        $('#allTimeValue').textContent = formatNumber(allTime);
        $('#goalProgressText').textContent = `${formatNumber(count)} / ${formatNumber(goal)}`;
        const percent = Math.min(100, Math.round((count / goal) * 100));
        $('#goalPercent').textContent = `${percent}%`;
        $('#goalProgressFill').style.width = `${Math.min(100, (count / goal) * 100)}%`;
        $('#goalProgressBar').setAttribute('aria-valuemax', String(goal));
        $('#goalProgressBar').setAttribute('aria-valuenow', String(Math.min(count, goal)));
        $('#remainingText').textContent = count >= goal ? 'Done' : `${formatNumber(goal - count)} left`;
        const elapsedMs = Date.now() - sessionStartedAt;
        $('#elapsedValue').textContent = formatDuration(elapsedMs);
        $('#rateValue').textContent = (count / Math.max(elapsedMs / 60000, 1 / 60)).toFixed(1);
        $('#sessionLabel').textContent = count >= goal ? 'Done' : 'Active';
        $('#undoButton').disabled = history.length === 0;
        $('#undoButton').style.opacity = history.length === 0 ? '.48' : '1';
      }
      function notify(message) {
        toast.textContent = message;
        toast.classList.add('show');
        clearTimeout(toastTimeout);
        toastTimeout = setTimeout(() => toast.classList.remove('show'), 2200);
      }
      function animateCount() {
        countDisplay.classList.remove('bump');
        // Restart the small count animation without relying on layout or external libraries.
        void countDisplay.offsetWidth;
        countDisplay.classList.add('bump');
      }
      function setCount(next, { record = true, celebrate = true } = {}) {
        const safeNext = validNumber(next, count, 0, 1_000_000_000);
        const delta = safeNext - count;
        if (delta === 0) { render(); return; }
        if (record) {
          history.push(count);
          if (history.length > 100) history.shift();
        }
        const previous = count;
        count = safeNext;
        if (delta > 0) allTime = Math.min(Number.MAX_SAFE_INTEGER, allTime + delta);
        best = Math.max(best, count);
        saveState();
        render();
        animateCount();
        if (celebrate && previous < goal && count >= goal) notify('Goal reached!');
      }
      function tap() { if (count >= 1_000_000_000) { notify('You reached the maximum count.'); return; } setCount(count + 1); }
      function decrement() { if (count <= 0) { notify('Your count is already at zero.'); return; } setCount(count - 1); }
      function undo() {
        if (!history.length) { notify('Nothing to undo yet.'); return; }
        const previous = history.pop();
        count = previous;
        saveState(); render(); animateCount();
        notify('Last change undone.');
      }
      function reset() {
        if (count === 0) { notify('Your counter is already at zero.'); return; }
        setCount(0);
        notify('Counter reset. A fresh start!');
      }
      function clearAll() {
        if (count === 0 && history.length === 0) { notify('Your counter is already clear.'); return; }
        count = 0; history = []; sessionStartedAt = Date.now();
        saveState(); render(); animateCount();
        notify('Counter cleared. Timer restarted.');
      }
      function openGoalModal() {
        goalInput.value = String(goal);
        goalModalBackdrop.classList.add('open');
        setTimeout(() => { goalInput.focus(); goalInput.select(); }, 40);
      }
      function closeGoalModal() {
        goalModalBackdrop.classList.remove('open');
        $('#editGoalButton').focus();
      }

      readSavedState();
      applyTheme(currentTheme);
      render();

      tapButton.addEventListener('click', tap);
      $('#minusButton').addEventListener('click', decrement);
      $('#undoButton').addEventListener('click', undo);
      $('#resetButton').addEventListener('click', reset);
      $('#clearButton').addEventListener('click', clearAll);
      themeToggle.addEventListener('click', () => applyTheme(currentTheme === 'light' ? 'dark' : 'light'));
      $('#editGoalButton').addEventListener('click', openGoalModal);
      $('#cancelGoalButton').addEventListener('click', closeGoalModal);
      goalModalBackdrop.addEventListener('click', (event) => { if (event.target === goalModalBackdrop) closeGoalModal(); });
      $('#goalForm').addEventListener('submit', (event) => {
        event.preventDefault();
        const nextGoal = Number(goalInput.value);
        if (!Number.isInteger(nextGoal) || nextGoal < 1 || nextGoal > 1_000_000_000) {
          goalInput.setCustomValidity('Enter a whole number from 1 to 1,000,000,000.');
          goalInput.reportValidity();
          return;
        }
        goalInput.setCustomValidity('');
        goal = nextGoal;
        saveState(); render(); closeGoalModal();
        notify(`Goal updated to ${formatNumber(goal)} taps.`);
      });
      goalInput.addEventListener('input', () => goalInput.setCustomValidity(''));
      document.addEventListener('keydown', (event) => {
        const target = event.target;
        const editing = target instanceof HTMLElement && (target.isContentEditable || ['INPUT','TEXTAREA','SELECT'].includes(target.tagName));
        if (editing || event.ctrlKey || event.metaKey || event.altKey) {
          if (event.key === 'Escape' && goalModalBackdrop.classList.contains('open')) closeGoalModal();
          return;
        }
        if (event.code === 'Space') {
          event.preventDefault();
          if (!goalModalBackdrop.classList.contains('open')) tap();
        } else if (event.key.toLowerCase() === 'u' && !goalModalBackdrop.classList.contains('open')) {
          event.preventDefault(); undo();
        } else if (event.key === 'Escape' && goalModalBackdrop.classList.contains('open')) {
          closeGoalModal();
        }
      });
      window.addEventListener('storage', (event) => {
        if (event.key === STORAGE_KEY && event.newValue) {
          // Respect updates made by another tab while keeping this instance in sync.
          readSavedState(); applyTheme(currentTheme); render();
        }
      });
      setInterval(render, 1000);
    })();
  </script>
</body>
</html>
