<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Tap Counter</title>
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --bg: #eef1ff;
    --bg-a: #e4d9ff;
    --bg-b: #cfe0ff;
    --surface: #f6f8fc;
    --text: #121a33;
    --muted: #5d6784;
    --line: #cdd5e6;
    --accent: #6a4cf5;
    --accent-hi: #9b6bff;
    --accent-lo: #3b4fe0;
    --grad-a: #8b4dff;
    --grad-b: #3b6bff;
    --on-accent: #ffffff;
    --track: rgba(255, 255, 255, 0.6);
    --shadow-lo: rgba(20, 30, 70, 0.22);
    --shadow-hi: rgba(255, 255, 255, 0.9);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e1020;
      --bg-a: #1f1156;
      --bg-b: #0a1a52;
      --surface: #121933;
      --text: #eef0fa;
      --muted: #9aa3c4;
      --line: #252e52;
      --accent: #8a7cff;
      --accent-hi: #b392ff;
      --accent-lo: #4a5fe0;
      --grad-a: #7c4dee;
      --grad-b: #3f6bf5;
      --on-accent: #ffffff;
      --track: rgba(255, 255, 255, 0.12);
      --shadow-lo: rgba(0, 0, 0, 0.6);
      --shadow-hi: rgba(120, 135, 220, 0.12);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e1020;
    --bg-a: #1f1156;
    --bg-b: #0a1a52;
    --surface: #121933;
    --text: #eef0fa;
    --muted: #9aa3c4;
    --line: #252e52;
    --accent: #8a7cff;
    --accent-hi: #b392ff;
    --accent-lo: #4a5fe0;
    --grad-a: #7c4dee;
    --grad-b: #3f6bf5;
    --on-accent: #ffffff;
    --track: rgba(255, 255, 255, 0.12);
    --shadow-lo: rgba(0, 0, 0, 0.6);
    --shadow-hi: rgba(120, 135, 220, 0.12);
    color-scheme: dark;
  }

  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0;
    height: 100%;
    background:
      radial-gradient(circle at 15% 20%, rgba(122, 95, 255, 0.22), transparent 32%),
      radial-gradient(circle at 85% 80%, rgba(0, 201, 167, 0.14), transparent 28%),
      var(--bg);
    color: var(--text);
    font-family: ui-rounded, "SF Pro Rounded", "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-tap-highlight-color: transparent;
    -webkit-font-smoothing: antialiased;
    transition: background-color .35s ease, color .35s ease;
  }
  button { font: inherit; color: inherit; }

  .app {
    height: 100%;
    max-width: 480px;
    margin: 0 auto;
    padding: 20px 22px 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  header {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  h1 { margin: 0; font-size: 1.05rem; font-weight: 650; letter-spacing: .01em; }

  .icon-btn {
    width: 44px; height: 44px;
    display: grid; place-items: center;
    border: 1px solid var(--line);
    border-radius: 50%;
    background: var(--surface);
    cursor: pointer;
    transition: transform .15s ease, border-color .2s ease, background-color .35s ease;
  }
  .icon-btn:hover { border-color: var(--accent); }
  .icon-btn:active { transform: scale(.92); }
  .icon-btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .icon-btn .sun { display: none; }
  :root[data-effective="dark"] .icon-btn .sun { display: block; }
  :root[data-effective="dark"] .icon-btn .moon { display: none; }

  :focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

  .readout {
    margin-top: auto;
    text-align: center;
    padding-top: 12px;
  }
  .count {
    display: block;
    font-size: clamp(4.5rem, 24vw, 7.5rem);
    font-weight: 750;
    line-height: 1;
    letter-spacing: -0.045em;
    font-variant-numeric: tabular-nums;
    min-height: 1em;
  }
  .sub {
    margin: 10px 0 0;
    font-size: .95rem;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    min-height: 1.4em;
  }

  .dial {
    --size: min(76vw, 46dvh, 320px);
    position: relative;
    width: var(--size);
    height: var(--size);
    margin: 22px 0;
    flex: none;
  }
  .ring { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); pointer-events: none; }
  .ring circle { fill: none; stroke-width: 7; stroke-linecap: round; }
  .ring .track { stroke: var(--track); transition: stroke .35s ease; }
  .ring .bar { stroke: url(#ringGrad); transition: stroke-dashoffset .28s cubic-bezier(.3, .8, .3, 1), stroke .35s ease, opacity .2s ease; }

  .tap {
    position: absolute;
    inset: 9%;
    border: 0;
    border-radius: 50%;
    cursor: pointer;
    overflow: hidden;
    color: var(--on-accent);
    background:
      radial-gradient(circle at 30% 22%, rgba(255, 255, 255, .28), transparent 55%),
      linear-gradient(145deg, var(--grad-a), var(--grad-b));
    box-shadow:
      0 18px 34px -10px var(--shadow-lo),
      0 3px 0 0 var(--accent-lo),
      inset 0 2px 3px rgba(255, 255, 255, .35);
    display: grid; place-items: center;
    touch-action: manipulation;
    user-select: none; -webkit-user-select: none;
    transition: transform .09s ease, box-shadow .09s ease, background .35s ease;
  }
  .tap:active, .tap.down {
    transform: translateY(3px) scale(.975);
    box-shadow:
      0 8px 16px -8px var(--shadow-lo),
      0 0 0 0 var(--accent-lo),
      inset 0 3px 8px rgba(0, 0, 0, .22);
  }
  .tap-face { display: grid; justify-items: center; gap: 4px; pointer-events: none; }
  .tap-face svg { width: 34%; min-width: 44px; stroke: currentColor; fill: none; stroke-width: 2.6; stroke-linecap: round; }
  .tap-face span { font-size: .95rem; font-weight: 650; letter-spacing: .02em; opacity: .85; }
  .ripple {
    position: absolute; border-radius: 50%; pointer-events: none;
    background: rgba(255, 255, 255, .45);
    width: 20px; height: 20px; margin: -10px 0 0 -10px;
  }

  .controls {
    width: 100%;
    display: grid;
    gap: 16px;
    margin-bottom: auto;
  }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .btn {
    min-height: 50px;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: var(--surface);
    font-weight: 600;
    cursor: pointer;
    transition: transform .12s ease, border-color .2s ease, background-color .25s ease, color .25s ease, opacity .2s ease;
  }
  .btn:hover:not(:disabled) { border-color: var(--accent); }
  .btn:active:not(:disabled) { transform: scale(.97); }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn.armed { background: var(--text); color: var(--bg); border-color: var(--text); }

  .goal { display: flex; align-items: center; gap: 12px; justify-content: center; }
  .goal-label { font-size: .9rem; color: var(--muted); }
  .chips { display: flex; gap: 6px; padding: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; }
  .chip {
    min-width: 52px; min-height: 36px; padding: 0 12px;
    border: 0; border-radius: 999px; background: transparent;
    font-weight: 600; font-size: .9rem; color: var(--muted); cursor: pointer;
    transition: background-color .2s ease, color .2s ease;
  }
  .chip[aria-checked="true"] { background: linear-gradient(135deg, var(--grad-a), var(--grad-b)); color: var(--on-accent); }

  .hint { margin: 0; text-align: center; font-size: .8rem; color: var(--muted); }
  kbd {
    font: inherit; font-size: .78rem; padding: 1px 6px;
    border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 6px; background: var(--surface);
  }
  @media (hover: none) { .hint { display: none; } }

  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(22px + env(safe-area-inset-bottom, 0px));
    transform: translate(-50%, 24px);
    opacity: 0;
    pointer-events: none;
    display: flex; align-items: center; gap: 14px;
    padding: 10px 10px 10px 18px;
    background: var(--text); color: var(--bg);
    border-radius: 14px;
    font-size: .92rem; font-weight: 550;
    box-shadow: 0 14px 30px -10px var(--shadow-lo);
    transition: opacity .2s ease, transform .25s cubic-bezier(.3, .8, .3, 1);
    z-index: 5;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
  .toast button {
    min-height: 36px; padding: 0 14px; border: 0; border-radius: 10px;
    background: linear-gradient(135deg, var(--grad-a), var(--grad-b)); color: var(--on-accent); font-weight: 650; cursor: pointer;
  }

  @media (max-height: 640px) {
    .count { font-size: clamp(3.5rem, 18vw, 5rem); }
    .dial { margin: 12px 0; --size: min(64vw, 40dvh, 260px); }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; }
  }
</style>
</head>
<body>
<main class="app">
  <header>
    <h1>Tap Counter</h1>
    <button class="icon-btn" id="theme" type="button" aria-label="Switch theme">
      <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </header>

  <section class="readout" aria-live="polite" aria-atomic="true">
    <span class="count" id="count">0</span>
    <p class="sub" id="sub">Free count</p>
  </section>

  <div class="dial" id="dial">
    <svg class="ring" viewBox="0 0 100 100" aria-hidden="true">
      <defs>
        <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" style="stop-color: var(--grad-a)"/>
          <stop offset="1" style="stop-color: var(--grad-b)"/>
        </linearGradient>
      </defs>
      <circle class="track" cx="50" cy="50" r="46"/>
      <circle class="bar" id="bar" cx="50" cy="50" r="46"/>
    </svg>
    <button class="tap" id="tap" type="button" aria-label="Add one to the count">
      <span class="tap-face">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        <span>Tap</span>
      </span>
    </button>
  </div>

  <section class="controls">
    <div class="actions">
      <button class="btn" id="undo" type="button">Undo last</button>
      <button class="btn" id="reset" type="button">Reset</button>
    </div>
    <div class="goal">
      <span class="goal-label" id="goal-label">Goal</span>
      <div class="chips" role="radiogroup" aria-labelledby="goal-label" id="chips">
        <button class="chip" type="button" role="radio" data-t="0">None</button>
        <button class="chip" type="button" role="radio" data-t="10">10</button>
        <button class="chip" type="button" role="radio" data-t="33">33</button>
        <button class="chip" type="button" role="radio" data-t="100">100</button>
      </div>
    </div>
    <p class="hint"><kbd>Space</kbd> to tap &nbsp; <kbd>Backspace</kbd> to undo</p>
  </section>
</main>

<div class="toast" id="toast" role="status">
  <span id="toast-msg"></span>
  <button type="button" id="toast-act">Undo</button>
</div>

<script>
(function () {
  var KEY = "tapcounter:v1", THEME_KEY = "tapcounter:theme";
  var root = document.documentElement;
  var $ = function (id) { return document.getElementById(id); };
  var els = {
    count: $("count"), sub: $("sub"), bar: $("bar"), dial: $("dial"), tap: $("tap"),
    undo: $("undo"), reset: $("reset"), chips: $("chips"), theme: $("theme"),
    toast: $("toast"), toastMsg: $("toast-msg"), toastAct: $("toast-act")
  };
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ---------- storage (never assume it works) ---------- */
  function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function save(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  var state = { count: 0, target: 0 };
  try {
    var saved = JSON.parse(load(KEY));
    if (saved && Number.isFinite(saved.count) && saved.count >= 0) state.count = Math.floor(saved.count);
    if (saved && [0, 10, 33, 100].indexOf(saved.target) > -1) state.target = saved.target;
  } catch (e) {}
  function persist() { save(KEY, JSON.stringify(state)); }

  /* ---------- ring geometry ---------- */
  var C = 2 * Math.PI * 46;
  els.bar.style.strokeDasharray = C;

  /* ---------- render ---------- */
  function render() {
    els.count.textContent = state.count.toLocaleString();
    var t = state.target, progress = 0, text = "Free count";
    if (t) {
      var within = state.count % t, rounds = Math.floor(state.count / t);
      var shown = (within === 0 && state.count > 0) ? t : within;
      progress = shown / t;
      text = shown + " / " + t + (rounds > 0 ? " \u00b7 " + rounds + (rounds === 1 ? " round" : " rounds") + " done" : "");
    }
    els.sub.textContent = text;
    els.bar.style.strokeDashoffset = C * (1 - progress);
    els.bar.style.opacity = t ? 1 : 0;
    els.undo.disabled = state.count === 0;
    els.reset.disabled = state.count === 0 && !armed;
    Array.prototype.forEach.call(els.chips.children, function (c) {
      var on = Number(c.dataset.t) === t;
      c.setAttribute("aria-checked", on);
      c.tabIndex = on ? 0 : -1;
    });
    persist();
  }

  /* ---------- feedback ---------- */
  function buzz(p) { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} }
  function bump() {
    if (reduce || !els.count.animate) return;
    els.count.animate([{ transform: "scale(1.1)" }, { transform: "scale(1)" }], { duration: 170, easing: "ease-out" });
  }
  function ripple(x, y) {
    if (reduce || !els.tap.animate) return;
    var r = document.createElement("span");
    r.className = "ripple";
    r.style.left = x + "px"; r.style.top = y + "px";
    els.tap.appendChild(r);
    var size = els.tap.offsetWidth / 10;
    var a = r.animate([{ transform: "scale(0)", opacity: 1 }, { transform: "scale(" + size + ")", opacity: 0 }], { duration: 520, easing: "ease-out" });
    a.onfinish = function () { r.remove(); };
  }
  function celebrate() {
    buzz([18, 50, 28]);
    if (reduce || !els.dial.animate) return;
    els.dial.animate([{ transform: "scale(1)" }, { transform: "scale(1.045)" }, { transform: "scale(1)" }], { duration: 420, easing: "ease-out" });
  }

  /* ---------- actions ---------- */
  function tap(x, y) {
    state.count += 1;
    render(); bump();
    var rect = els.tap.getBoundingClientRect();
    ripple(x == null ? rect.width / 2 : x - rect.left, y == null ? rect.height / 2 : y - rect.top);
    if (state.target && state.count % state.target === 0) celebrate(); else buzz(8);
  }
  function undo() {
    if (state.count === 0) return;
    state.count -= 1; render(); bump(); buzz(6);
  }

  var armed = false, armTimer;
  function disarm() {
    armed = false; clearTimeout(armTimer);
    els.reset.classList.remove("armed"); els.reset.textContent = "Reset";
    render();
  }
  function onReset() {
    if (!armed) {
      armed = true;
      els.reset.classList.add("armed"); els.reset.textContent = "Tap again to confirm";
      armTimer = setTimeout(disarm, 2600);
      return;
    }
    var prev = state.count;
    disarm();
    state.count = 0; render(); bump(); buzz(20);
    showToast("Counter reset", "Undo", function () { state.count = prev; render(); bump(); });
  }

  var toastTimer, toastCb = null;
  function showToast(msg, label, cb) {
    els.toastMsg.textContent = msg; els.toastAct.textContent = label; toastCb = cb;
    els.toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(hideToast, 5000);
  }
  function hideToast() { els.toast.classList.remove("show"); toastCb = null; }
  els.toastAct.addEventListener("click", function () { if (toastCb) toastCb(); hideToast(); });

  /* ---------- input ---------- */
  els.tap.addEventListener("pointerdown", function (e) {
    if (e.pointerType === "mouse" && e.button !== 0) return;
    e.preventDefault();
    els.tap.focus({ preventScroll: true });
    tap(e.clientX, e.clientY);
  });
  els.tap.addEventListener("click", function (e) { if (e.detail === 0) tap(); }); // keyboard / assistive tech
  els.tap.addEventListener("contextmenu", function (e) { e.preventDefault(); });

  document.addEventListener("keydown", function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var onOtherControl = e.target.closest && e.target.closest("button") && e.target !== els.tap;
    if (e.key === " " || e.key === "Enter") {
      if (onOtherControl) return;
      e.preventDefault();
      if (e.repeat) return;
      els.tap.classList.add("down"); tap();
    } else if ((e.key === "Backspace" || e.key === "ArrowDown") && !onOtherControl) {
      e.preventDefault(); undo();
    } else if (e.key === "ArrowUp" && !onOtherControl) {
      e.preventDefault(); if (!e.repeat) tap();
    }
  });
  document.addEventListener("keyup", function (e) {
    if (e.key === " " || e.key === "Enter") { els.tap.classList.remove("down"); if (e.target === els.tap) e.preventDefault(); }
  });

  els.undo.addEventListener("click", undo);
  els.reset.addEventListener("click", onReset);
  els.reset.addEventListener("blur", function () { if (armed) disarm(); });

  els.chips.addEventListener("click", function (e) {
    var c = e.target.closest(".chip"); if (!c) return;
    state.target = Number(c.dataset.t); render();
  });
  els.chips.addEventListener("keydown", function (e) {
    var list = Array.prototype.slice.call(els.chips.children);
    var i = list.indexOf(document.activeElement);
    if (i < 0) return;
    var next = e.key === "ArrowRight" ? i + 1 : e.key === "ArrowLeft" ? i - 1 : null;
    if (next === null) return;
    e.preventDefault(); e.stopPropagation();
    var n = list[(next + list.length) % list.length];
    n.focus(); n.click();
  });

  /* ---------- theme ---------- */
  var mq = window.matchMedia("(prefers-color-scheme: dark)");
  function effective() { return root.dataset.theme || (mq.matches ? "dark" : "light"); }
  function syncTheme() {
    var t = effective();
    root.dataset.effective = t;
    els.theme.setAttribute("aria-label", t === "dark" ? "Switch to light mode" : "Switch to dark mode");
  }
  var savedTheme = load(THEME_KEY);
  if (savedTheme === "light" || savedTheme === "dark") root.dataset.theme = savedTheme;
  els.theme.addEventListener("click", function () {
    var next = effective() === "dark" ? "light" : "dark";
    root.dataset.theme = next; save(THEME_KEY, next); syncTheme();
  });
  if (mq.addEventListener) mq.addEventListener("change", syncTheme);
  syncTheme();

  render();
})();
</script>
</body>
</html>
